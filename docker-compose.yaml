# The app image against Postgres, on http://localhost:8091.
services:
  app:
    build: .
    ports:
      - "8091:8091"
    environment:
      DATABASE_URL: postgresql+psycopg://kittyface:kittyface@db/kittyface
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kittyface
      POSTGRES_PASSWORD: kittyface
      POSTGRES_DB: kittyface
    volumes:
      - kittyface-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kittyface"]
      interval: 2s
      retries: 15

volumes:
  kittyface-pg:
