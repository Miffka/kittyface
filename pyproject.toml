[project]
name = "kittyface"
version = "0.1.0"
description = "Cat facial landmarks"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "python-multipart>=0.0.32",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "httpx", "python-dotenv", "onnx", "onnxruntime", "onnxsim", "openvino", "opencv-python-headless", "numpy", "pytest-playwright>=0.10.0"]
train = ["tf2onnx==1.17.0", "tensorflow-cpu==2.21.0"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/e2e needs Docker and a browser; run it with `make test-e2e`.
norecursedirs = [".*", "node_modules", "venv", "e2e"]

[tool.ruff]
line-length = 88
